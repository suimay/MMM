services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: mmm
      POSTGRES_USER: ${MMM_DB_USER:-mmm}
      POSTGRES_PASSWORD: ${MMM_DB_PASSWORD:?Set MMM_DB_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${MMM_DB_PORT:-5432}:5432"
    volumes:
      - mmm-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mmm-postgres:
