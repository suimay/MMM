spring.application.name=mmm-server
server.port=${MMM_PORT:8080}
server.address=${MMM_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${MMM_DB_URL}
spring.datasource.username=${MMM_DB_USER}
spring.datasource.password=${MMM_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.parser.strict-duplicate-detection=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=128KB
server.tomcat.connection-timeout=15s
mmm.session-duration=${MMM_SESSION_DURATION:PT12H}
spring.main.banner-mode=off
mmm.logs.dir=${MMM_LOG_DIR:${user.home}/.mmm/logs}
